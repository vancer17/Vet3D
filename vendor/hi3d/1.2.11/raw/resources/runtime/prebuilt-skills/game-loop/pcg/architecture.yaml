schema: pcg.architecture.v1
entry: game-loop
kind: agent_skill
layout: linear
tasks:
  - id: root
    parent: null
    role: agent
    label: "游戏时钟与生命周期"
    function: "按已确认目标编排游戏时钟与生命周期，已有结果可跳过集成，只复核相应行为。"
    outputs: []
  - id: contract
    parent: root
    role: local
    label: "核对输入与不变量"
    function: "读取目标工程与契约，确定 createClock({hz,maxSteps}) → 时钟；advance(clock,elapsed秒) → {clock,steps}；pause(clock,flag) → 时钟；transition(state,event) → 状态名；确认范围，复用现有有效状态，不新增文件。"
    outputs: []
  - id: integrate
    parent: contract
    role: local
    label: "接入规则模块"
    function: "接入现有引擎 update；一次 RAF 调一次 advance，按 steps 用固定 dt 执行模拟，渲染插值使用 remainder/dt。暂停/隐藏时清输入与积累，恢复重设真实时钟锚点。"
    outputs:
      - id: implementation
        label: "本次工程模块改动（JS/TS）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: contract
  - id: verify
    parent: integrate
    role: local
    label: "验证规则与工程行为"
    function: "检查 暂停恢复、长帧预算、非法状态迁移、重开后单一循环；失败回到集成阶段，报告实际验证环境和剩余服务前提。"
    outputs:
      - id: validation
        label: "实际验证与限制说明（JSON/Markdown）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: integrate
