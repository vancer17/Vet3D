schema: pcg.architecture.v1
entry: game-package
kind: agent_skill
layout: linear
tasks:
  - id: root
    parent: null
    role: agent
    label: "游戏包清单检查"
    function: "按已确认目标编排游戏包清单检查，已有结果可跳过集成，只复核相应行为。"
    outputs: []
  - id: contract
    parent: root
    role: local
    label: "核对输入与不变量"
    function: "读取目标工程与契约，确定 validateManifest({schema:\"game-package.v1\",id,version,entry,permissions,files:[{path,bytes,sha256}]}) → {valid,issues,bytes}；确认范围，复用现有有效状态，不新增文件。"
    outputs: []
  - id: integrate
    parent: contract
    role: local
    label: "接入规则模块"
    function: "从实际文件生成清单后逐文件验证字节和 SHA-256；将声明与实际读取结果比较。网页试玩使用独立来源与受限权限，跨来源服务须明确提供。不能以清单通过称作安全检查通过。"
    outputs:
      - id: implementation
        label: "本次工程模块改动（JS/TS）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: contract
  - id: verify
    parent: integrate
    role: local
    label: "验证规则与工程行为"
    function: "检查 路径穿越、重复路径、丢失入口、非法权限与大小预算；失败回到集成阶段，报告实际验证环境和剩余服务前提。"
    outputs:
      - id: validation
        label: "实际验证与限制说明（JSON/Markdown）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: integrate
