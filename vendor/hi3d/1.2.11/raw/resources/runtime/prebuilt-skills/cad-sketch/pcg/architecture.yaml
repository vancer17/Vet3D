schema: pcg.architecture.v1
entry: cad-sketch
kind: agent_skill
layout: linear
tasks:
- id: root
  parent: null
  role: agent
  label: FreeCAD 约束草图
  function: 创建全约束矩形/圆草图、拉伸和直孔口袋，修改命名尺寸，另存 FCStd 和 STEP 并回读体积；单位毫米。
- id: input
  parent: root
  role: local
  label: 校验输入与资源
  function: 校验配方和素材路径，核对实际软件及预算；成功缓存需重新核对哈希，无新业务产物。
  outputs: []
- id: run
  parent: input
  role: local
  label: 执行FreeCAD 约束草图
  function: 用声明的本地后端执行，另存到任务目录；失败记录错误，超时中断不自动续跑。
  outputs:
  - id: native
    label: hi3d-project.FCStd、hi3d-solid.step、hi3d-review.json
    kind: file
    retain: keep
    semantics:
    - deliverable
  rollback_to: input
- id: review
  parent: run
  role: local
  label: 回读与验收
  function: 解析实际输出，检查声明的不变量与源文件哈希；仅通过后写 completed。
  outputs:
  - id: result
    label: hi3d-result.json：产物哈希与实际检查范围
    kind: file
    retain: keep
    semantics:
    - report
  rollback_to: run
