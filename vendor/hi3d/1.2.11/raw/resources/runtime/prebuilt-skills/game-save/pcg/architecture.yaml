schema: pcg.architecture.v1
entry: game-save
kind: agent_skill
layout: linear
tasks:
  - id: root
    parent: null
    role: agent
    label: "游戏存档迁移"
    function: "按已确认目标编排游戏存档迁移，已有结果可跳过集成，只复核相应行为。"
    outputs: []
  - id: contract
    parent: root
    role: local
    label: "核对输入与不变量"
    function: "读取目标工程与契约，确定 encode(game,version,data) → JSON；decode(text,{game,version,migrations,validate,maxBytes}) → 数据；writeSave(storage,key,text) → 无返回；确认范围，复用现有有效状态，不新增文件。"
    outputs: []
  - id: integrate
    parent: contract
    role: local
    label: "接入规则模块"
    function: "使用游戏命名空间与槽位键。先读原字节再迁移，先通过 validate，再写新槽位；校验成功后才更新活动槽位。不要用空档自动覆盖坏档。"
    outputs:
      - id: implementation
        label: "本次工程模块改动（JS/TS）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: contract
  - id: verify
    parent: integrate
    role: local
    label: "验证规则与工程行为"
    function: "检查 不同游戏拒绝、未来版本拒绝、迁移缺失、非法 JSON 值、存储异常；失败回到集成阶段，报告实际验证环境和剩余服务前提。"
    outputs:
      - id: validation
        label: "实际验证与限制说明（JSON/Markdown）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: integrate
