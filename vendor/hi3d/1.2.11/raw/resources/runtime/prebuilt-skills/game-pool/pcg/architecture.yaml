schema: pcg.architecture.v1
entry: game-pool
kind: agent_skill
layout: linear
tasks:
  - id: root
    parent: null
    role: agent
    label: "游戏对象池租约"
    function: "按已确认目标编排游戏对象池租约，已有结果可跳过集成，只复核相应行为。"
    outputs: []
  - id: contract
    parent: root
    role: local
    label: "核对输入与不变量"
    function: "读取目标工程与契约，确定 createPool(capacity) → 池；acquire(pool) → {pool,handle}；release(pool,handle) → 池；isAlive(pool,handle) → 布尔；确认范围，复用现有有效状态，不新增文件。"
    outputs: []
  - id: integrate
    parent: contract
    role: local
    label: "接入规则模块"
    function: "项目用槽位索引映射预创建实例；重用前重置血量/计时器/材质，异步回调先查 isAlive。不同池句柄不混用；GPU 资源释放由引擎适配负责。"
    outputs:
      - id: implementation
        label: "本次工程模块改动（JS/TS）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: contract
  - id: verify
    parent: integrate
    role: local
    label: "验证规则与工程行为"
    function: "检查 耗尽不扩容、释放复用、旧世代句柄拒绝、重复释放；失败回到集成阶段，报告实际验证环境和剩余服务前提。"
    outputs:
      - id: validation
        label: "实际验证与限制说明（JSON/Markdown）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: integrate
