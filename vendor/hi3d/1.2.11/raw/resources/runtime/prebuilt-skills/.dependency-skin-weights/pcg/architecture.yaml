note: "线形进程：检查点顺序前进，rollback_to 回退到更早步骤；不是 workflow 编排树。缺省由 package-tools 自 routes 生成，手调后不再覆盖。"
tasks:
  - id: skin_weights
    parent: null
    role: agent
    label: "确认输入"
