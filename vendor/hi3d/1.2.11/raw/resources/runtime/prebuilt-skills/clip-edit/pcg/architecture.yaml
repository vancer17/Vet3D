schema: pcg.architecture.v1
entry: clip-edit
kind: agent_workflow
layout: tree
tasks:
  - id: clip_edit
    parent: null
    role: agent
    label: "视频剪辑编排"
    function: "收集素材与时间线，先半分辨率预览再成片；无音轨仍可无声导出。已有合格 MP4 可从 deliver 续接。"
    outputs: []
  - id: intake
    parent: clip_edit
    role: local
    label: "素材与时间线"
    function: "登记图片/视频路径、顺序、入出点。探测失败列出无法解码文件，等待替换或移除，不写半截成片。"
    outputs: []
  - id: prefer
    parent: clip_edit
    role: local
    label: "画幅时长与样式"
    function: "确认 portrait 或 landscape 固定规格、目标时长、转场帧、字幕样式和是否混音。推荐竖屏须经用户确认。"
    outputs:
      - id: timeline
        label: "时间线 JSON"
        kind: file
        retain: keep
        semantics: [provenance]
  - id: review_plan
    parent: clip_edit
    role: local
    label: "检查时间线"
    function: "plan_edit 生成 media-edit/字幕配方；静帧走 still_clip。缺必要入出点停在对应片段。"
    outputs:
      - id: plan
        label: "剪辑 plan JSON"
        kind: file
        retain: keep
        semantics: [provenance]
  - id: preview_cut
    parent: clip_edit
    role: local
    label: "低分辨率预览"
    function: "等待 review_plan。以半分辨率调用 media-edit；可选 subtitle-track 与 audio-mix。预览可播放后才允许 produce。"
    outputs:
      - id: preview
        label: "低分辨率预览 MP4"
        kind: file
        retain: cache
        semantics: [review]
  - id: produce
    parent: clip_edit
    role: local
    label: "导出成片"
    function: "用完整分辨率再次调用 media-edit；按需字幕与混音。编码失败保留预览与配方。抽封面。"
    members:
      - id: cut
        label: "调用 media-edit"
      - id: captions
        label: "可选字幕"
      - id: mix
        label: "可选混音"
    outputs:
      - id: video
        label: "成片 MP4"
        kind: file
        retain: keep
        semantics: [deliverable]
      - id: cover
        label: "封面 PNG"
        kind: file
        retain: keep
        semantics: [deliverable]
      - id: srt
        label: "SRT 字幕"
        kind: file
        retain: keep
        semantics: [deliverable]
  - id: media_edit
    parent: produce
    role: subagent
    entry: media-edit
    label: "裁切拼接"
    function: "独立 media-edit 按入出点、变速和画幅输出 MP4，不隐式保留音轨。"
    outputs:
      - id: cut
        label: "无声或画面 MP4"
        kind: file
        retain: cache
        semantics: [reference]
  - id: subtitle_track
    parent: produce
    role: subagent
    entry: subtitle-track
    optional: true
    label: "字幕轨道"
    function: "有 cues 时独立 subtitle-track 写出 SRT/ASS；时间不合法则失败。"
    outputs:
      - id: srt
        label: "字幕文件"
        kind: file
        retain: keep
        semantics: [deliverable]
  - id: audio_mix
    parent: produce
    role: subagent
    entry: audio-mix
    optional: true
    label: "配乐与素材声"
    function: "有用户配乐或保留素材声时独立 audio-mix 合成到成片；无音轨跳过。"
    outputs:
      - id: mixed
        label: "带声 MP4"
        kind: file
        retain: keep
        semantics: [deliverable]
  - id: deliver
    parent: clip_edit
    role: local
    label: "成片与封面"
    function: "media-check 解码成片；asset-page 与 delivery-review 只挂真实 MP4/封面/SRT。无声成片不算缺项。"
    outputs:
      - id: page
        label: "成果页 HTML"
        kind: file
        retain: keep
        semantics: [deliverable]
  - id: media_check
    parent: deliver
    role: subagent
    entry: media-check
    label: "成片解码检查"
    function: "独立 media-check 核对宽高、帧率、时长并完整解码。"
    outputs:
      - id: report
        label: "媒体检查报告"
        kind: file
        retain: cache
        semantics: [review]
  - id: asset_page
    parent: deliver
    role: subagent
    entry: asset-page
    label: "本地成果页"
    function: "独立 asset-page 接收成片、封面与下载文件。"
    outputs:
      - id: index
        label: "index.html"
        kind: file
        retain: keep
        semantics: [deliverable]
  - id: delivery_review
    parent: deliver
    role: subagent
    entry: delivery-review
    label: "打开与下载核对"
    function: "独立 delivery-review 核对文件可打开；视频须实际播放记录。"
    outputs:
      - id: list
        label: "交付清单"
        kind: file
        retain: keep
        semantics: [review]
