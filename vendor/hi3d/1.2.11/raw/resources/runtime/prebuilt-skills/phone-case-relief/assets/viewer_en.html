<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Case · 3D Viewer</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#11161b;color:#e8eef3;font:15px system-ui,sans-serif}header{padding:20px 24px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #303c46}h1{font-size:20px;margin:0 0 6px}p{margin:0;color:#a9bac7;font-size:13px}nav{display:flex;gap:8px;flex-wrap:wrap}button,a.button,label.button{color:#eaf4f0;background:#233b33;border:1px solid #49705e;border-radius:8px;padding:10px 14px;cursor:pointer;text-decoration:none;font:inherit}button:hover,a:hover,label:hover{background:#345746}model-viewer{width:100%;height:calc(100dvh - 170px);min-height:380px;background:radial-gradient(ellipse at 50% 35%,#39434c,#172028 75%)}footer{padding:14px 24px;line-height:1.8;color:#a9bac7;font-size:13px}#status{color:#93deb9}#file{display:none}#name{overflow-wrap:anywhere}button:focus-visible,a:focus-visible,label:focus-within{outline:3px solid #93deb9}@media(max-width:650px){header{padding:14px}model-viewer{height:65dvh}footer{padding:14px}}</style></head>
<body><header><div><h1>Phone Case · 3D Viewer</h1><p id="name">__MODEL_NAME_HTML__</p></div><nav><button id="outside">Case exterior</button><button id="inside">Case interior</button><button id="rotate" aria-pressed="false">Auto-rotate</button><button id="full">Fullscreen</button><label class="button">Open another GLB<input id="file" type="file" accept=".glb"></label><a id="download" class="button">Download GLB</a></nav></header>
<model-viewer id="viewer" alt="Phone case with relief decoration" camera-controls touch-action="pan-y" camera-orbit="__EXTERIOR_ORBIT__" min-camera-orbit="auto 0deg auto" max-camera-orbit="auto 180deg auto" environment-image="neutral" exposure="1" shadow-intensity="0" interaction-prompt="auto"></model-viewer>
<footer><div id="status" role="status">Loading viewer and model…</div><div>Drag to rotate · Scroll or pinch to zoom · Shift + drag to pan</div><div>The model is embedded in this HTML. Internet access is required to load the viewer component.</div></footer>
<script id="model-data" type="application/octet-stream">__MODEL_DATA__</script>
<script>
const viewer=document.getElementById('viewer'),status=document.getElementById('status'),download=document.getElementById('download');let activeUrl;
function show(blob,name){if(activeUrl)URL.revokeObjectURL(activeUrl);activeUrl=URL.createObjectURL(blob);viewer.setAttribute('src',activeUrl);download.href=activeUrl;download.download=name;document.getElementById('name').textContent=name;status.textContent='Loading model…';}
const encoded=document.getElementById('model-data').textContent.trim(),chunks=[];for(let i=0;i<encoded.length;i+=1048576){const binary=atob(encoded.slice(i,i+1048576)),bytes=new Uint8Array(binary.length);for(let j=0;j<binary.length;j++)bytes[j]=binary.charCodeAt(j);chunks.push(bytes);}show(new Blob(chunks,{type:'model/gltf-binary'}),__MODEL_NAME_JS__);document.getElementById('model-data').remove();
viewer.addEventListener('load',()=>{status.textContent='Model ready. Drag to rotate and scroll to zoom.'});viewer.addEventListener('error',()=>{status.textContent='Unable to load the model. Try a current version of Chrome, Edge, or Safari, or download the GLB to view locally.';});
document.getElementById('outside').onclick=()=>{viewer.cameraOrbit='__EXTERIOR_ORBIT__';viewer.cameraTarget='auto auto auto';viewer.fieldOfView='auto';};document.getElementById('inside').onclick=()=>{viewer.cameraOrbit='__INTERIOR_ORBIT__';viewer.cameraTarget='auto auto auto';};document.getElementById('rotate').onclick=e=>{viewer.autoRotate=!viewer.autoRotate;e.target.setAttribute('aria-pressed',String(viewer.autoRotate));e.target.textContent=viewer.autoRotate?'Stop rotation':'Auto-rotate';};document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await viewer.requestFullscreen();}catch(e){status.textContent='Fullscreen is unavailable. Please use your browser’s fullscreen controls.';}};document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(f)show(f,f.name);};setTimeout(()=>{if(!customElements.get('model-viewer'))status.textContent='The viewer component could not load. Check your connection and refresh. The GLB download is still available.';},20000);
</script></body></html>
