schema: pcg.architecture.v1
entry: game-replay
kind: agent_skill
layout: linear
tasks:
  - id: root
    parent: null
    role: agent
    label: "游戏规则回放"
    function: "按已确认目标编排游戏规则回放，已有结果可跳过集成，只复核相应行为。"
    outputs: []
  - id: contract
    parent: root
    role: local
    label: "核对输入与不变量"
    function: "读取目标工程与契约，确定 replay(initial,commands,reducer,{maxCommands,invariant}) → {state,trace}；seededRandom(seed) → 随机函数；确认范围，复用现有有效状态，不新增文件。"
    outputs: []
  - id: integrate
    parent: contract
    role: local
    label: "接入规则模块"
    function: "记录规则版本、种子与语义命令而非渲染像素；对同一版本重复回放并比较关键状态。变化规则时旧回放必须标为不兼容，不能静默套用新参数。"
    outputs:
      - id: implementation
        label: "本次工程模块改动（JS/TS）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: contract
  - id: verify
    parent: integrate
    role: local
    label: "验证规则与工程行为"
    function: "检查 相同种子一致、每步不变量、输入不变、命令预算；失败回到集成阶段，报告实际验证环境和剩余服务前提。"
    outputs:
      - id: validation
        label: "实际验证与限制说明（JSON/Markdown）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: integrate
