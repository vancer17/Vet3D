schema: pcg.architecture.v1
entry: game-browser-check
kind: agent_skill
layout: linear
tasks:
  - id: root
    parent: null
    role: agent
    label: "浏览器玩法验收"
    function: "按已确认目标编排浏览器玩法验收，已有结果可跳过集成，只复核相应行为。"
    outputs: []
  - id: contract
    parent: root
    role: local
    label: "核对输入与不变量"
    function: "读取目标工程与契约，确定 checkBrowser(browser,{url,timeoutMs,allowedOrigins,viewport,steps}) → {passed,errors,requests}；确认范围，复用现有有效状态，不新增文件。"
    outputs: []
  - id: integrate
    parent: contract
    role: local
    label: "接入规则模块"
    function: "浏览器和 HTTP 服务沿用宿主权限及工程环境；steps 仅 click/fill/press/visible/text，最后必须断言已就绪状态。为开始/操作/暂停/恢复/结算/重开/按需资源分别提供序列；实际查看截图。"
    outputs:
      - id: implementation
        label: "本次工程模块改动（JS/TS）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: contract
  - id: verify
    parent: integrate
    role: local
    label: "验证规则与工程行为"
    function: "检查 实际 HTTP 请求、资源缺失、断言失败、上下文 finally 清理；失败回到集成阶段，报告实际验证环境和剩余服务前提。"
    outputs:
      - id: validation
        label: "实际验证与限制说明（JSON/Markdown）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: integrate
