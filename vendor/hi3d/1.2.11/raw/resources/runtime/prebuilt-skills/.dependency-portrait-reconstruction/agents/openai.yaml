interface:
  display_name: "可打印头雕"
  short_description: "按图像处理、几何生成、可选后处理、纹理和拆分制作头雕，实际打印适配另验"
  default_prompt: "使用 $portrait-reconstruction 按五阶段制作头雕，选择转正或保留原图 yaw/pitch/roll 的当前视角四视图；共用雕刻发流、裁切与材质，过细发流和悬空刘海可适度加粗，保留发型并验收根部连接，不一律删刘海。四视图检查耳朵位置和头发遮挡一致，不要求露耳、不为检查拨开头发。内置评审通过并获人工确认后另验服务视角契约，当前相对视角未验证不提交。后处理默认关闭但必须询问并获得用户答复；纹理默认使用前面已生成并验收的 front，缺失则询问，不自动换原图。拆分阶段必交付并主动打开交互 HTML，等待用户调阈值、处理和下载；不默认代切割，不用已切模型代替 HTML。"
