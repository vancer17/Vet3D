<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title · 拆件打印模型</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f2f1ed;color:#202928}main{max-width:1280px;margin:auto;padding:36px}h1{font-size:38px;line-height:1.2;margin:12px 0}h2{font-size:23px}p{line-height:1.7}.eyebrow{letter-spacing:2px;font-size:12px;color:#55736c}a{color:#196754;text-decoration:none}a:hover{text-decoration:underline}.downloads{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.downloads a{background:#265e4c;color:white;border-radius:9px;padding:14px 22px;font-weight:600}.downloads a.secondary{background:#fff;color:#265e4c;border:1px solid #b7c4be}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button,select{padding:9px 14px;border:1px solid #b7c4be;border-radius:7px;background:white;color:#264c41}.viewer{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}canvas{width:100%;height:65vh;min-height:380px;touch-action:none;border-radius:14px;background:#e8eaeb}#parts{background:#fff;border-radius:14px;padding:16px;overflow-wrap:anywhere}#parts label{display:block;font-size:13px;margin:12px 0}#parts a{float:right}.note{border-left:3px solid #c68f4b;padding:10px 18px;background:#f8f2e7}table{width:100%;border-collapse:collapse;background:white}td,th{padding:12px;border-bottom:1px solid #e1e6e1;text-align:left;vertical-align:top}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}details{margin-top:24px;background:white;padding:18px;border-radius:12px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.gallery img{width:100%;border-radius:10px}.gallery figure{margin:0}.gallery figcaption{padding:8px 0}.table-wrap{overflow:auto}@media(max-width:850px){main{padding:20px}h1{font-size:30px}.viewer,.gallery{grid-template-columns:1fr}canvas{height:55vh}.downloads a{flex:1;text-align:center}}
</style>
</head>
<body><main>
<p class="eyebrow">PRINT KIT / 模型与打印文件</p><h1>$title</h1>
<p>$stats。拖拽旋转、滚轮缩放，可切换装配、拆解和摆盘。</p>
<nav class="downloads" aria-label="下载制作文件">
<a id="download-glb" href="assembly.glb" download="assembly.glb">下载装配 GLB</a>
<a id="download-stl" class="secondary" href="parts-stl.zip" download="parts-stl.zip">下载分部件 STL 打印包</a>
</nav>
<div class="toolbar"><label>查看 <select id="mode"><option value="assembly">装配</option><option value="exploded">拆解</option><option value="plates">摆盘</option><option value="operation">功能位置</option></select></label><label>拆解距离 <input id="explode" type="range" min="0" max="160" value="0"></label><button id="reset">重置视角</button></div>
<p id="viewer-status" role="status"></p><div class="viewer"><canvas id="view" aria-label="可旋转的模型预览"></canvas><aside id="parts" aria-label="零件显隐与单件下载"></aside></div>
<p class="note">数字几何检查通过。切片、实体试配、连接保持力和承载性能按各自证据验收；打印前按说明完成试片。GLB 用于装配查看，打印请使用 ZIP 内的毫米制分件 STL。</p>
<h2>零件清单</h2><div class="table-wrap"><table><thead><tr><th>零件</th><th>打印数量</th><th>打印尺寸 mm</th><th>支撑与打印说明</th></tr></thead><tbody>$part_rows</tbody></table></div>
$gallery
<details><summary>装配与打印说明</summary><pre>$instructions</pre></details>
<details><summary>验证范围</summary><pre>$validation</pre></details>
<details><summary>离线展示组件许可</summary><pre>$license</pre></details>
</main>
<script id="print-kit-data" type="application/json">$payload</script>
<script>window.PRINT_KIT=JSON.parse(document.getElementById('print-kit-data').textContent);</script>
<script>$downloads_js</script>
<script>$three_js</script>
<script>$viewer_js</script>
</body></html>
