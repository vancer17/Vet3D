schema: pcg.architecture.v1
entry: replace-brief
kind: agent_skill
layout: linear
note: "线形进程：检查点顺序前进，rollback_to 回退到更早步骤；不是 workflow 编排树。"
tasks:
  - id: replace_brief
    parent: null
    role: agent
    label: "截图替换简报"
    function: "编排从截图框选替换区到素材缺口清单的原子流程；不生成几何、不调用检测/分割服务、不提交 Hi3D。"
    outputs: []
  - id: input
    parent: replace_brief
    role: local
    label: "截图与意图"
    function: "确认本地截图可打开、画面版本一致、用户替换/保留意图，以及已经放到任务目录的照片、GLB 或尺寸说明。记录授权范围仅覆盖读图与整理需求，不含生成。已有合格 overlay/brief/requests 且源图未变时走 review_only，登记既有槽后进入 request 核对缺口。本阶段不新增文件。"
    outputs: []
    members:
      - id: collect
        label: "收集截图路径、意图和已交素材"
  - id: locate
    parent: input
    role: local
    label: "框选与裁切"
    optional: true
    rollback_to: input
    function: "执行者对照截图为每个可独立替换或明确保留的对象填写稳定 id、role、像素框、可见证据与推定；脚本校验框在图内且与归一化互推一致，在全新输出目录写入 brief.json、overlay.png 和 replace 目标的 crops/<id>.png。源截图只读。重叠框允许，空框、越界或重复 id 失败。裁切存在不等于对象身份正确，须目视 overlay。"
    members:
      - id: mark
        label: "按意图区分 replace 与 keep/context 目标"
      - id: crop
        label: "校验框选并写出 overlay 与裁切"
    outputs:
      - id: brief
        label: "含框选与证据的 replace-brief.v1（brief.json）"
        kind: file
        retain: keep
        semantics:
          - deliverable
      - id: overlay
        label: "带框选标注的截图副本（overlay.png）"
        kind: file
        retain: keep
        semantics:
          - review
      - id: crops
        label: "替换目标像素裁切（crops/<id>.png）"
        kind: file
        retain: keep
        semantics:
          - deliverable
  - id: request
    parent: locate
    role: local
    label: "素材缺口索取"
    rollback_to: locate
    function: "读取 locate 产物或已有 brief，按每个 replace 目标 material_needed.minimum 核对 provided 文件是否存在且种类匹配。缺项写入 requests.json 并用固定中文模板生成 ask，原样向用户索取，不编造照片或模型、不调用 hi3d-api。全部 minimum 已齐则 requests 为空数组，status=ready，仍须人工确认框选对象无误。keep/context 不进入索取列表。纯核对可无新文件；新缺口必须写出 requests.json 并回写 brief。"
    members:
      - id: gaps
        label: "比较 minimum 与 provided，生成索取列表"
    outputs:
      - id: requests
        label: "待向用户索取的素材清单（requests.json）"
        kind: file
        retain: keep
        semantics:
          - deliverable
          - request
