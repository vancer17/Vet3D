schema: pcg.architecture.v1
entry: relief-box
kind: agent_workflow
layout: tree
note: "执行架构：编排 agent 与显式独立入口；不是 routes.yaml 的用户选项图。宿主编排提示见 tools/pcg-view/references/host-orchestration.md。"
tasks:
  - id: relief_box
    parent: null
    role: agent
    label: "收纳物、尺寸与主题"
    function: "编排 relief-box"
  - id: brief
    parent: relief_box
    label: "收纳物、尺寸与主题"
    function: "本 agent 收纳物、尺寸与主题"
    outputs:
      - id: brief
        label: "收纳物、尺寸与主题"
        kind: file
        retain: keep
        semantics:
          - deliverable
    role: local
    members:
      - id: work
        label: "收纳物、尺寸与主题"
  - id: research
    parent: relief_box
    label: "开合、分区与连接研究"
    function: "本 agent 开合、分区与连接研究"
    outputs:
      - id: research
        label: "开合、分区与连接研究"
        kind: file
        retain: keep
        semantics:
          - deliverable
    role: local
    members:
      - id: work
        label: "开合、分区与连接研究"
  - id: form
    parent: relief_box
    label: "盒体与艺术浮雕"
    function: "派出 hi3d-api"
    outputs:
      - id: form
        label: "盒体与艺术浮雕"
        kind: file
        retain: keep
        semantics:
          - deliverable
    role: subagent
    entry: hi3d-api
    members:
      - id: invoke
        label: "调用 hi3d-api"
    irreversible:
      - hi3d.submit
  - id: structure
    parent: relief_box
    label: "内托、盖体与固定"
    function: "本 agent 内托、盖体与固定"
    outputs:
      - id: structure
        label: "内托、盖体与固定"
        kind: file
        retain: keep
        semantics:
          - deliverable
    role: local
    members:
      - id: work
        label: "内托、盖体与固定"
  - id: fdm
    parent: relief_box
    label: "配对试片与打印套件"
    function: "本 agent 配对试片与打印套件"
    outputs:
      - id: fdm
        label: "配对试片与打印套件"
        kind: file
        retain: keep
        semantics:
          - deliverable
    role: local
    members:
      - id: work
        label: "配对试片与打印套件"
    irreversible:
      - overwrite.source
  - id: media
    parent: relief_box
    label: "开合、取放与装配展示"
    function: "本 agent 开合、取放与装配展示"
    outputs:
      - id: media
        label: "开合、取放与装配展示"
        kind: file
        retain: cache
        semantics:
          - derived
          - cache
    role: local
    members:
      - id: work
        label: "开合、取放与装配展示"
    irreversible:
      - blender.write
  - id: web
    parent: relief_box
    label: "网页与制作包"
    function: "派出 game-deploy"
    outputs:
      - id: web
        label: "网页与制作包"
        kind: file
        retain: keep
        semantics:
          - deliverable
    role: subagent
    entry: game-deploy
    members:
      - id: invoke
        label: "调用 game-deploy"
    irreversible:
      - publish
