schema: pcg.architecture.v1
entry: game-score
kind: agent_skill
layout: linear
tasks:
  - id: root
    parent: null
    role: agent
    label: "游戏成绩排名"
    function: "按已确认目标编排游戏成绩排名，已有结果可跳过集成，只复核相应行为。"
    outputs: []
  - id: contract
    parent: root
    role: local
    label: "核对输入与不变量"
    function: "读取目标工程与契约，确定 rankScores(records,{game,player,limit}) → {top,self,total}；确认范围，复用现有有效状态，不新增文件。"
    outputs: []
  - id: integrate
    parent: contract
    role: local
    label: "接入规则模块"
    function: "沿用项目既定分数验证与持久化方式。UI 接收排名结果，不自行截前十后找本人；离线演示明确标本地榜，不宣称多人可信排行。"
    outputs:
      - id: implementation
        label: "本次工程模块改动（JS/TS）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: contract
  - id: verify
    parent: integrate
    role: local
    label: "验证规则与工程行为"
    function: "检查 跨游戏隔离、同分、本人在前十之外、重复玩家最高分；失败回到集成阶段，报告实际验证环境和剩余服务前提。"
    outputs:
      - id: validation
        label: "实际验证与限制说明（JSON/Markdown）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: integrate
