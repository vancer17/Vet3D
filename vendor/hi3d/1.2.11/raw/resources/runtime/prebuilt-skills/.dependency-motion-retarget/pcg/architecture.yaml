    parent: null
    role: agent
    label: "确认输入"
    function: "编排 motion-retarget"
  - id: input
    parent: motion_retarget
    label: "确认输入"
    outputs:
      - id: input
        label: "确认输入"
        kind: file
        retain: keep
        semantics:
          - deliverable
    role: local
    function: "本 agent 确认输入"
    members:
      - id: work
        label: "确认输入"
  - id: run
    parent: input
    label: "执行能力"
    outputs: []
    rollback_to: input
