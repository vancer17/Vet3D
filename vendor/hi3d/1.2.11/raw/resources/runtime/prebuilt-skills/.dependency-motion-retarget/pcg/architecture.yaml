    function: "在内存中按源目标休止矩阵、层级和映射转换已有动作采样，返回目标旋转和根位置；场景烘焙由调用方执行。"
    members:
      - id: work
        label: "本地转换动作采样"
    optional: true
  - id: review
    parent: run
    label: "核对产物"
