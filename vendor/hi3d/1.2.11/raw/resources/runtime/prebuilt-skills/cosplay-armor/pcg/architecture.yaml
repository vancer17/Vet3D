schema: pcg.architecture.v1
entry: cosplay-armor
kind: agent_workflow
layout: tree
note: "执行架构：编排 agent 与显式独立入口；不是 routes.yaml 的用户选项图。宿主编排提示见 tools/pcg-view/references/host-orchestration.md。"
tasks:
  - id: cosplay_armor
    parent: null
    role: agent
    label: "佩戴部位、量体与主题"
    function: "编排 cosplay-armor"
  - id: brief
    parent: cosplay_armor
    label: "佩戴部位、量体与主题"
    function: "本 agent 佩戴部位、量体与主题"
    outputs:
      - id: brief
        label: "佩戴部位、量体与主题"
        kind: file
        retain: keep
        semantics:
          - deliverable
    role: local
    members:
      - id: work
        label: "佩戴部位、量体与主题"
  - id: research
    parent: cosplay_armor
    label: "接触、固定与材料研究"
    function: "本 agent 接触、固定与材料研究"
    outputs:
      - id: research
        label: "接触、固定与材料研究"
        kind: file
        retain: keep
        semantics:
          - deliverable
    role: local
    members:
      - id: work
        label: "接触、固定与材料研究"
  - id: form
    parent: cosplay_armor
    label: "艺术外壳与平滑内腔"
    function: "派出 hi3d-api"
    outputs:
      - id: form
        label: "艺术外壳与平滑内腔"
        kind: file
        retain: keep
        semantics:
          - deliverable
    role: subagent
    entry: hi3d-api
    members:
      - id: invoke
        label: "调用 hi3d-api"
    irreversible:
      - hi3d.submit
  - id: fit
    parent: cosplay_armor
    label: "活动避让、装配与快脱"
    function: "本 agent 活动避让、装配与快脱"
    outputs:
      - id: fit
        label: "活动避让、装配与快脱"
        kind: file
        retain: keep
        semantics:
          - deliverable
    role: local
    members:
      - id: work
        label: "活动避让、装配与快脱"
  - id: fdm
    parent: cosplay_armor
    label: "适配试片与打印套件"
    function: "本 agent 适配试片与打印套件"
    outputs:
      - id: fdm
        label: "适配试片与打印套件"
        kind: file
        retain: keep
        semantics:
          - deliverable
    role: local
    members:
      - id: work
        label: "适配试片与打印套件"
    irreversible:
      - overwrite.source
  - id: media
    parent: cosplay_armor
    label: "佩戴、装配与活动展示"
    function: "本 agent 佩戴、装配与活动展示"
    outputs:
      - id: media
        label: "佩戴、装配与活动展示"
        kind: file
        retain: cache
        semantics:
          - derived
          - cache
    role: local
    members:
      - id: work
        label: "佩戴、装配与活动展示"
    irreversible:
      - blender.write
  - id: web
    parent: cosplay_armor
    label: "网页与制作包"
    function: "派出 game-deploy"
    outputs:
      - id: web
        label: "网页与制作包"
        kind: file
        retain: keep
        semantics:
          - deliverable
    role: subagent
    entry: game-deploy
    members:
      - id: invoke
        label: "调用 game-deploy"
    irreversible:
      - publish
