schema: pcg.architecture.v1
entry: game-collision
kind: agent_skill
layout: linear
tasks:
  - id: root
    parent: null
    role: agent
    label: "连续盒体碰撞"
    function: "按已确认目标编排连续盒体碰撞，已有结果可跳过集成，只复核相应行为。"
    outputs: []
  - id: contract
    parent: root
    role: local
    label: "核对输入与不变量"
    function: "读取目标工程与契约，确定 sweep({min:[x,y,z],max:[x,y,z]},delta,obstacle) → {hit,time,normal,overlap}；time 为本步 0..1；确认范围，复用现有有效状态，不新增文件。"
    outputs: []
  - id: integrate
    parent: contract
    role: local
    label: "接入规则模块"
    function: "从可见资产构建显式代理，候选位移使用 sweep 截到接触前。滑动/多接触响应有界迭代并单独验收，不能用盒体结果声称高模精确碰撞。"
    outputs:
      - id: implementation
        label: "本次工程模块改动（JS/TS）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: contract
  - id: verify
    parent: integrate
    role: local
    label: "验证规则与工程行为"
    function: "检查 高速穿越、平行分离、接触后远离、初始重叠、输入非法；失败回到集成阶段，报告实际验证环境和剩余服务前提。"
    outputs:
      - id: validation
        label: "实际验证与限制说明（JSON/Markdown）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: integrate
