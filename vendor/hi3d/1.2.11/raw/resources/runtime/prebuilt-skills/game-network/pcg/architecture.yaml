schema: pcg.architecture.v1
entry: game-network
kind: agent_skill
layout: linear
tasks:
  - id: root
    parent: null
    role: agent
    label: "联网快照接收"
    function: "按已确认目标编排联网快照接收，已有结果可跳过集成，只复核相应行为。"
    outputs: []
  - id: contract
    parent: root
    role: local
    label: "核对输入与不变量"
    function: "读取目标工程与契约，确定 acceptSnapshot(current,incoming) → {accepted,reason,snapshot}；interpolate(a,b,time) → {x,y,z}；retryDelay(attempt,config) → 毫秒或 null；确认范围，复用现有有效状态，不新增文件。"
    outputs: []
  - id: integrate
    parent: contract
    role: local
    label: "接入规则模块"
    function: "把 transport 与纯状态分离；连接重建先重新认证，重连预算耗尽显示恢复入口。发送输入而不是可信分数；外部消息要校验大小与字段，再调用模块。"
    outputs:
      - id: implementation
        label: "本次工程模块改动（JS/TS）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: contract
  - id: verify
    parent: integrate
    role: local
    label: "验证规则与工程行为"
    function: "检查 乱序拒绝、旧 session 拒绝、快照复制隔离、插值夹紧、有限重试；失败回到集成阶段，报告实际验证环境和剩余服务前提。"
    outputs:
      - id: validation
        label: "实际验证与限制说明（JSON/Markdown）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: integrate
