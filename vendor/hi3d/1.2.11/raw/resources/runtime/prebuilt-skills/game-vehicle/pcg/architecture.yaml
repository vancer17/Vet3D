schema: pcg.architecture.v1
entry: game-vehicle
kind: agent_skill
layout: linear
tasks:
  - id: root
    parent: null
    role: agent
    label: "平面驾驶与赛道检查点"
    function: "按已确认目标编排平面驾驶与赛道检查点，已有结果可跳过集成，只复核相应行为。"
    outputs: []
  - id: contract
    parent: root
    role: local
    label: "核对输入与不变量"
    function: "读取目标工程与契约，确定 drive({x,z,heading,speed},{throttle,steer},dt,{wheelbase,maxSpeed,acceleration,drag,maxSteer}) → 新状态；checkpoint({next,laps},index,total) → 进度；确认范围，复用现有有效状态，不新增文件。"
    outputs: []
  - id: integrate
    parent: contract
    role: local
    label: "接入规则模块"
    function: "先设车辆尺度与轴距，固定步长驱动，用碰撞系统处理候选移动。触发圈和可视圈共用位置；检查点按进入边沿触发，末点不等于可以跳过中间点。"
    outputs:
      - id: implementation
        label: "本次工程模块改动（JS/TS）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: contract
  - id: verify
    parent: integrate
    role: local
    label: "验证规则与工程行为"
    function: "检查 直行、转向、静止、速度上限、跳过检查点无效；失败回到集成阶段，报告实际验证环境和剩余服务前提。"
    outputs:
      - id: validation
        label: "实际验证与限制说明（JSON/Markdown）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: integrate
