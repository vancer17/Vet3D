schema: pcg.architecture.v1
entry: remotion-render
kind: agent_skill
layout: linear
tasks:
- id: root
  parent: null
  role: agent
  label: 参数化动效渲染
  function: 使用本地 Remotion 模板组合文字、矩形、图片、音轨及平移/淡入关键帧，渲染视频并验证帧数。
- id: input
  parent: root
  role: local
  label: 校验输入与资源
  function: 校验配方和素材路径，核对实际软件及预算；成功缓存需重新核对哈希，无新业务产物。
  outputs: []
- id: run
  parent: input
  role: local
  label: 执行参数化动效渲染
  function: 用声明的本地后端执行，另存到任务目录；失败记录错误，超时中断不自动续跑。
  outputs:
  - id: native
    label: hi3d-video.mp4、hi3d-props.json、public 素材
    kind: file
    retain: keep
    semantics:
    - deliverable
  rollback_to: input
- id: review
  parent: run
  role: local
  label: 回读与验收
  function: 解析实际输出，检查声明的不变量与源文件哈希；仅通过后写 completed。
  outputs:
  - id: result
    label: hi3d-result.json：产物哈希与实际检查范围
    kind: file
    retain: keep
    semantics:
    - report
  rollback_to: run
