kind: agent_workflow
partition: make
entry: SKILL.md
note: "设备外壳：内腔、接口与装配，不发明假 op。"
ui:
  option_buttons: true
  choice_role: option
checkpoints:
  - id: spec
    say: "确认设备规格"
    rollback_to: null
    load:
      - SKILL.md
      - references/workflow.md
    irreversible: []
  - id: generate_art
    say: "生成新艺术纹样"
    rollback_to: spec
    load:
      - SKILL.md
      - references/workflow.md
    irreversible:
      - hi3d.submit
    confirm_required: true
  - id: shell
    say: "外壳与内腔"
    rollback_to: spec
    load:
      - SKILL.md
      - references/workflow.md
    irreversible: []
  - id: fit
    say: "接口与紧固"
    rollback_to: shell
    load:
      - SKILL.md
      - references/workflow.md
    irreversible: []
  - id: review
    say: "装配检查"
    rollback_to: fit
    load:
      - SKILL.md
      - references/workflow.md
    irreversible:
      - blender.write
    confirm_required: true
routes:
  - id: main
    summary: "规格到外壳"
    nodes:
      - spec
      - shell
      - fit
      - review
    rollback_to: shell
  - id: reuse_art
    summary: "已有外形，只做内腔"
    nodes:
      - spec
      - shell
      - fit
      - review
  - id: new_art
    summary: "生成纹样后制作外壳"
    nodes:
      - spec
      - generate_art
      - shell
      - fit
      - review
    shares_input_with: main
choices_example:
  - id: from_device
    title: "按设备做完整外壳"
    route: main
    confirm: true
  - id: have_art
    title: "已有外形，补内腔接口"
    route: reuse_art
    confirm: true
  - id: new_art
    title: "生成纹样后制作外壳"
    route: new_art
    confirm: true
  - id: back_shell
    title: "回退到上一检查点"
    rollback_to: shell
    confirm: false
