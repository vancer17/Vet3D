schema: pcg.architecture.v1
entry: game-combat
kind: agent_skill
layout: linear
tasks:
  - id: root
    parent: null
    role: agent
    label: "游戏战斗结算"
    function: "按已确认目标编排游戏战斗结算，已有结果可跳过集成，只复核相应行为。"
    outputs: []
  - id: contract
    parent: root
    role: local
    label: "核对输入与不变量"
    function: "读取目标工程与契约，确定 strike(state,{attacker,target,tick,match},{damage,cooldown}) → {state,events}；确认范围，复用现有有效状态，不新增文件。"
    outputs: []
  - id: integrate
    parent: contract
    role: local
    label: "接入规则模块"
    function: "每个战局使用新 match；渲染与音效只消费 events。检测命中后交给统一结算，不在 UI 再扣血。连续伤害以明确 tick 决定，不用动画帧数。"
    outputs:
      - id: implementation
        label: "本次工程模块改动（JS/TS）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: contract
  - id: verify
    parent: integrate
    role: local
    label: "验证规则与工程行为"
    function: "检查 冷却期间零伤害、友军和死者拒绝、旧局拒绝、生命下限、输入不变；失败回到集成阶段，报告实际验证环境和剩余服务前提。"
    outputs:
      - id: validation
        label: "实际验证与限制说明（JSON/Markdown）"
        kind: file
        retain: keep
        semantics:
          - deliverable
    rollback_to: integrate
