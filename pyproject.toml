# 文件信息：Vet3D 产品包的安装、构建和开发检查配置。
# 运行时使用标准库、SQLAlchemy 与 pydantic-settings；参考原件和产品包分开，环境配置不定义业务能力。
[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "vet3d"
version = "0.1.0"
description = "Vet3D 后端应用的最小装配骨架"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic-settings[yaml]==2.16.3",
    "sqlalchemy==2.0.58",
]

[project.scripts]
vet3d-demo = "vet3d.host:main"
vet3d-contract-probe = "vet3d.host:probe_main"
vet3d-operations-probe = "vet3d.host:operations_main"

[dependency-groups]
dev = ["mypy==2.4.1"]

[tool.hatch.build]
exclude = ["/src/vet3d/infrastructure"]

[tool.hatch.build.targets.wheel]
packages = ["src/vet3d"]

[tool.hatch.build.targets.sdist]
only-include = ["src/vet3d", "tests/runtime", "pyproject.toml", "uv.lock", ".python-version", "README.md", "LICENSE"]

[tool.mypy]
python_version = "3.14"
strict = true
files = [
    "src/vet3d/__init__.py",
    "src/vet3d/application",
    "src/vet3d/adapters",
    "src/vet3d/bootstrap",
    "src/vet3d/host",
    "src/vet3d/identity",
    "src/vet3d/artifacts",
    "src/vet3d/modeling",
    "src/vet3d/execution",
    "src/vet3d/assessment",
    "src/vet3d/delivery",
    "src/vet3d/workspaces",
    "src/vet3d/resources",
    "src/vet3d/operations",
    "src/vet3d/experiments",
    "tests/runtime",
]
